<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>AURA CORE // Perfect Neural Topography</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       DEEP SPACE NEURAL THEME
       ========================================= */
    :root {
      --bg-core: #04010a; 
      --neon-purple: #8a2be2;
      --neon-cyan: #00ffff;
      
      --glass-bg: rgba(6, 2, 14, 0.75);
      --glass-border: rgba(138, 43, 226, 0.4);
      --text-main: #f8fafc;
      --text-muted: #8b79a5;
    }

    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      overflow: hidden; background-color: var(--bg-core);
      font-family: 'Inter', sans-serif; color: var(--text-main);
      user-select: none;
    }

    /* Эффект виньетки по краям для глубины */
    .screen-glow {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(circle at center, transparent 30%, rgba(4, 1, 10, 0.95) 100%);
    }

    #neural-engine { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

    /* =========================================
       SYSTEM TOP BAR & DOCK
       ========================================= */
    .sys-bar {
      position: absolute; top: 0; left: 0; width: 100%; height: 40px;
      background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(138, 43, 226, 0.2);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 25px; z-index: 100; font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem; letter-spacing: 2px; backdrop-filter: blur(5px);
    }
    .sys-status { display: flex; align-items: center; gap: 15px; color: var(--neon-cyan); font-weight: 700; text-shadow: 0 0 10px var(--neon-cyan); }
    .blinking-dot { width: 8px; height: 8px; background: var(--neon-cyan); border-radius: 50%; box-shadow: 0 0 15px var(--neon-cyan); animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.1; } }
    
    .os-dock {
      position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%);
      background: rgba(4, 1, 10, 0.85); border: 1px solid var(--glass-border);
      border-radius: 20px; padding: 12px 25px; display: flex; gap: 25px;
      z-index: 100; backdrop-filter: blur(25px); box-shadow: 0 15px 50px rgba(0,0,0,0.9), 0 0 30px rgba(138, 43, 226, 0.3);
    }
    .dock-icon {
      width: 50px; height: 50px; border-radius: 12px; background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: center; align-items: center;
      font-size: 1.6rem; cursor: pointer; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative; color: rgba(255,255,255,0.7);
    }
    .dock-icon:hover { transform: translateY(-15px) scale(1.15); color: #fff; background: rgba(138, 43, 226, 0.2); border-color: #d900ff; box-shadow: 0 0 25px rgba(138, 43, 226, 0.6); }
    
    .dock-label {
      position: absolute; top: -35px; font-family: 'JetBrains Mono'; font-size: 0.75rem;
      background: rgba(0,0,0,0.9); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan); text-shadow: 0 0 5px var(--neon-cyan); opacity: 0; transition: 0.2s; pointer-events: none; white-space: nowrap;
    }
    .dock-icon:hover .dock-label { opacity: 1; transform: translateY(-5px); }

    /* =========================================
       HOLO WINDOWS (Скрыты по умолчанию)
       ========================================= */
    .holo-window {
      position: absolute; width: 800px; height: 600px;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      border-radius: 16px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      box-shadow: inset 0 0 40px rgba(138, 43, 226, 0.1), 0 30px 60px rgba(0,0,0,0.95);
      display: none; flex-direction: column; z-index: 10;
      transition: opacity 0.3s, filter 0.3s; overflow: hidden; resize: both; min-width: 600px; min-height: 400px;
    }
    .holo-window.active { display: flex; animation: windowOpen 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
    .holo-window.focus { z-index: 50; box-shadow: inset 0 0 50px rgba(138, 43, 226, 0.2), 0 0 80px rgba(0,0,0,0.95); border-color: var(--neon-cyan); filter: blur(0px); }
    .holo-window.active:not(.focus) { filter: blur(3px); opacity: 0.6; }
    
    @keyframes windowOpen { from { opacity: 0; transform: scale(0.9) translateY(40px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    .window-header {
      background: rgba(0,0,0,0.85); padding: 15px 25px; border-bottom: 1px solid rgba(138, 43, 226, 0.3);
      display: flex; justify-content: space-between; align-items: center; cursor: grab;
    }
    .window-header:active { cursor: grabbing; }
    .window-title { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 700; color: #fff; text-shadow: 0 0 10px var(--neon-cyan); letter-spacing: 2px; }
    
    .window-controls { display: flex; gap: 12px; }
    .win-btn { width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer; transition: 0.2s; }
    .win-close { background: #ff0055; opacity: 0.6; }
    .win-close:hover { opacity: 1; box-shadow: 0 0 15px #ff0055; }

    .window-content { padding: 40px; overflow-y: auto; flex-grow: 1; user-select: text; }
    .window-content::-webkit-scrollbar { width: 6px; }
    .window-content::-webkit-scrollbar-thumb { background: rgba(138, 43, 226, 0.5); border-radius: 10px; }

    /* =========================================
       INITIALIZATION SCREEN
       ========================================= */
    #init-screen {
      position: fixed; inset: 0; background: #000; z-index: 10000;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      transition: opacity 1.5s ease-out;
    }
    .init-btn {
      background: transparent; border: 1px solid var(--neon-cyan); color: #fff; text-shadow: 0 0 15px var(--neon-cyan);
      font-family: 'Orbitron', sans-serif; font-size: 2.2rem; font-weight: 900;
      padding: 25px 80px; border-radius: 4px; cursor: pointer; position: relative;
      overflow: hidden; transition: 0.4s; text-transform: uppercase; letter-spacing: 6px;
      box-shadow: inset 0 0 30px rgba(0,240,255,0.1), 0 0 40px rgba(0,240,255,0.2);
    }
    .init-btn:hover { background: rgba(0, 240, 255, 0.15); box-shadow: inset 0 0 60px rgba(0,240,255,0.4), 0 0 100px rgba(0,240,255,0.6); transform: scale(1.05); }

  </style>
</head>
<body>

  <!-- INITIALIZATION -->
  <div id="init-screen">
    <button class="init-btn" onclick="bootSystem()">АКТИВАЦИЯ ЯДРА</button>
  </div>

  <!-- NEURAL 3D ENGINE CANVAS -->
  <canvas id="neural-engine"></canvas>
  <div class="screen-glow"></div>

  <!-- TOP BAR -->
  <div class="sys-bar">
    <div class="sys-status">
      <div class="blinking-dot"></div>
      <span>AURA CORE v5.0 // NEURAL TOPOGRAPHY ENGINE</span>
    </div>
    <div id="sys-clock">00:00:00</div>
  </div>

  <!-- WINDOW 1: Placeholder -->
  <div class="holo-window" id="win-work" style="top: 60px; left: 40px; width: 800px; height: 80vh;">
    <div class="window-header">
      <div class="window-title">📊 MOD_01: БАЗА ДАННЫХ ИИ</div>
      <div class="window-controls"><button class="win-btn win-close" onclick="closeWindow('win-work')"></button></div>
    </div>
    <div class="window-content" style="font-family: 'JetBrains Mono'; font-size: 14px; line-height: 1.6;">
      <h2 style="color: var(--neon-cyan); font-family: 'Orbitron';">СИСТЕМА ИНИЦИАЛИЗИРОВАНА</h2>
      <p>Движок топографического рендеринга успешно запущен. Модули обучения загружены в фоновом режиме. Интерфейс адаптирован под визуализацию пространственных данных.</p>
    </div>
  </div>

  <!-- DOCK -->
  <div class="os-dock">
    <div class="dock-icon" onclick="openWindow('win-work')" style="color: var(--neon-cyan);">
      <span class="dock-label">Терминал_01</span>📊
    </div>
    <div class="dock-icon" onclick="openWindow('win-work')" style="color: #ff007f;">
      <span class="dock-label">Терминал_02</span>🧬
    </div>
  </div>

  <script>
    // ==========================================
    // 1. ИНИЦИАЛИЗАЦИЯ И ОКОННЫЙ МЕНЕДЖЕР
    // ==========================================
    function bootSystem() {
      const initScreen = document.getElementById('init-screen');
      initScreen.style.opacity = '0';
      setTimeout(() => { initScreen.style.display = 'none'; }, 1500);
    }

    let zIndexCounter = 10;
    function openWindow(id) {
      const win = document.getElementById(id);
      if(!win.classList.contains('active')) win.classList.add('active');
      focusWindow(win);
    }
    function closeWindow(id) { document.getElementById(id).classList.remove('active'); }
    function focusWindow(win) {
      document.querySelectorAll('.holo-window').forEach(w => w.classList.remove('focus'));
      win.classList.add('focus');
      zIndexCounter++;
      win.style.zIndex = zIndexCounter;
    }

    document.querySelectorAll('.holo-window').forEach(win => {
      const header = win.querySelector('.window-header');
      let isDragging = false, startX, startY, initialX, initialY;
      win.addEventListener('mousedown', () => focusWindow(win));
      header.addEventListener('mousedown', (e) => {
        isDragging = true; startX = e.clientX; startY = e.clientY;
        initialX = win.offsetLeft; initialY = win.offsetTop;
        document.body.style.cursor = 'grabbing';
      });
      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        win.style.left = `${initialX + (e.clientX - startX)}px`;
        win.style.top = `${initialY + (e.clientY - startY)}px`;
      });
      document.addEventListener('mouseup', () => { isDragging = false; document.body.style.cursor = 'default'; });
    });

    setInterval(() => { document.getElementById('sys-clock').innerText = new Date().toLocaleTimeString('ru-RU'); }, 1000);

    // ==========================================
    // 2. SECRET DISPLACEMENT ENGINE (ИСТИННЫЙ 3D РЕНДЕР)
    // ==========================================
    const canvas = document.getElementById('neural-engine');
    const ctx = canvas.getContext('2d');
    let width, height;
    let time = 0;
    
    // Скрытый холст для генерации карты высот (Depth Map)
    const hiddenCanvas = document.createElement('canvas');
    const hctx = hiddenCanvas.getContext('2d');
    const depthSize = 256; 
    hiddenCanvas.width = depthSize;
    hiddenCanvas.height = depthSize;
    let depthData = [];

    function generateDepthMap() {
      hctx.fillStyle = '#000'; // Черный фон (ноль высоты)
      hctx.fillRect(0, 0, depthSize, depthSize);
      
      // Рисуем анатомию лица размытыми фигурами
      // Чем белее цвет, тем выше точка на 3D графике
      
      // Базовая форма головы (овал)
      hctx.fillStyle = 'rgba(100, 100, 100, 1)';
      hctx.beginPath(); hctx.ellipse(128, 110, 70, 95, 0, 0, Math.PI*2); hctx.fill();
      
      // Лоб и надбровные дуги
      hctx.fillStyle = 'rgba(180, 180, 180, 1)';
      hctx.beginPath(); hctx.ellipse(128, 80, 55, 30, 0, 0, Math.PI*2); hctx.fill();
      
      // Глазницы (ВЫРЕЗАЕМ объем черным цветом)
      hctx.globalCompositeOperation = 'source-over';
      hctx.fillStyle = 'rgba(0, 0, 0, 1)';
      hctx.beginPath(); hctx.ellipse(100, 105, 18, 12, 0, 0, Math.PI*2); hctx.fill();
      hctx.beginPath(); hctx.ellipse(156, 105, 18, 12, 0, 0, Math.PI*2); hctx.fill();
      
      // Возвращаем режим наложения света
      hctx.globalCompositeOperation = 'lighter';
      
      // Переносица и кончик носа (самые яркие точки)
      hctx.fillStyle = 'rgba(200, 200, 200, 1)';
      hctx.beginPath(); hctx.ellipse(128, 120, 12, 25, 0, 0, Math.PI*2); hctx.fill();
      hctx.fillStyle = 'rgba(255, 255, 255, 1)'; // Кончик носа
      hctx.beginPath(); hctx.ellipse(128, 145, 16, 12, 0, 0, Math.PI*2); hctx.fill();
      
      // Скулы
      hctx.fillStyle = 'rgba(120, 120, 120, 1)';
      hctx.beginPath(); hctx.ellipse(90, 135, 20, 25, -0.5, 0, Math.PI*2); hctx.fill();
      hctx.beginPath(); hctx.ellipse(166, 135, 20, 25, 0.5, 0, Math.PI*2); hctx.fill();
      
      // Губы (две полоски)
      hctx.fillStyle = 'rgba(140, 140, 140, 1)';
      hctx.beginPath(); hctx.ellipse(128, 172, 25, 8, 0, 0, Math.PI*2); hctx.fill();
      hctx.fillStyle = 'rgba(110, 110, 110, 1)';
      hctx.beginPath(); hctx.ellipse(128, 182, 22, 6, 0, 0, Math.PI*2); hctx.fill();
      
      // Подбородок
      hctx.fillStyle = 'rgba(170, 170, 170, 1)';
      hctx.beginPath(); hctx.ellipse(128, 205, 28, 20, 0, 0, Math.PI*2); hctx.fill();

      // Шея и ключицы
      hctx.fillStyle = 'rgba(70, 70, 70, 1)';
      hctx.beginPath(); hctx.ellipse(128, 230, 40, 40, 0, 0, Math.PI*2); hctx.fill();
      hctx.beginPath(); hctx.ellipse(70, 256, 60, 20, -0.2, 0, Math.PI*2); hctx.fill();
      hctx.beginPath(); hctx.ellipse(186, 256, 60, 20, 0.2, 0, Math.PI*2); hctx.fill();

      // МАГИЯ: Сильное размытие (Blur) превращает пятна в идеальную гладкую 3D-карту
      hctx.globalCompositeOperation = 'source-over';
      hctx.fillStyle = 'rgba(0,0,0,0.5)';
      
      // Имплементация программного блюра через отрисовку с прозрачностью (кроссбраузерно)
      for(let i=0; i<8; i++) {
         hctx.drawImage(hiddenCanvas, -2, -2, depthSize+4, depthSize+4);
         hctx.drawImage(hiddenCanvas, 2, 2, depthSize-4, depthSize-4);
      }

      // Сохраняем пиксели в массив
      const imgData = hctx.getImageData(0, 0, depthSize, depthSize).data;
      depthData = new Float32Array(depthSize * depthSize);
      for(let i=0; i<depthData.length; i++) {
        // Берем красный канал (R), нормализуем от 0 до 1
        depthData[i] = imgData[i*4] / 255.0; 
      }
    }

    // Функция получения высоты Z в точке (x, y) где координаты от 0 до 1
    function getZ(x, y) {
      if (x < 0 || x > 1 || y < 0 || y > 1) return 0;
      let px = Math.floor(x * (depthSize - 1));
      let py = Math.floor(y * (depthSize - 1));
      return depthData[py * depthSize + px];
    }

    function resize() { 
      width = canvas.width = window.innerWidth; 
      height = canvas.height = window.innerHeight; 
      generateDepthMap(); // Перегенерируем карту при ресайзе
    }
    window.addEventListener('resize', resize); resize();

    function animateEngine() {
      ctx.fillStyle = '#04010a';
      ctx.fillRect(0, 0, width, height);
      time += 0.02;

      let centerX = width / 2;
      let centerY = height / 2;

      // 1. КОНЦЕНТРИЧЕСКИЕ ВОЛНЫ НА ФОНЕ
      ctx.lineWidth = 1;
      for(let r=1; r<=15; r++) {
        let radius = (time * 15 + r * 60) % (width/1.2);
        ctx.beginPath();
        ctx.arc(centerX, centerY - 50, radius, 0, Math.PI * 2);
        let opacity = 1 - (radius / (width/1.5));
        ctx.strokeStyle = `rgba(138, 43, 226, ${Math.max(0, opacity * 0.15)})`;
        ctx.setLineDash([2, 8]);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // 2. ЦЕНТРАЛЬНЫЙ ЛУЧ ЭНЕРГИИ
      let beamGrad = ctx.createLinearGradient(centerX, 0, centerX, height);
      beamGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
      beamGrad.addColorStop(0.2, 'rgba(255, 255, 255, 1)'); // Ослепительный центр
      beamGrad.addColorStop(0.4, 'rgba(138, 43, 226, 0.8)');
      beamGrad.addColorStop(0.8, 'rgba(0, 255, 255, 0.2)');
      beamGrad.addColorStop(1, 'rgba(0, 255, 255, 0)');
      
      ctx.beginPath();
      ctx.moveTo(centerX, 0);
      ctx.lineTo(centerX, height);
      ctx.lineWidth = 2;
      ctx.strokeStyle = beamGrad;
      ctx.stroke();
      
      // Свечение вокруг луча
      ctx.lineWidth = 25;
      ctx.strokeStyle = 'rgba(138, 43, 226, 0.1)';
      ctx.stroke();

      // 3. РЕНДЕР ЛИЦА ИЗ ЛИНИЙ (Joy Division Effect)
      const numLines = 100; // Количество горизонтальных линий
      const pointsPerLine = 300; // Детализация линии
      
      // Задаем область на экране, где будет лицо (в процентах от экрана)
      const faceWidth = Math.min(width * 0.8, 800); // Ограничиваем максимальную ширину лица
      const faceHeight = faceWidth * 1.2; 
      const startX = centerX - faceWidth / 2;
      const startY = centerY - faceHeight / 2 - 50; // Чуть выше центра

      // Создаем глобальный градиент для линий через весь экран
      let lineGradient = ctx.createLinearGradient(0, 0, width, 0);
      lineGradient.addColorStop(0, 'rgba(138, 43, 226, 0.3)'); // Фиолетовый край
      lineGradient.addColorStop(0.3, 'rgba(138, 43, 226, 0.8)'); 
      lineGradient.addColorStop(0.48, 'rgba(0, 255, 255, 0.9)'); // Циан ближе к центру
      lineGradient.addColorStop(0.5, 'rgba(255, 255, 255, 1)');  // Белый луч в центре
      lineGradient.addColorStop(0.52, 'rgba(0, 255, 255, 0.9)');
      lineGradient.addColorStop(0.7, 'rgba(138, 43, 226, 0.8)');
      lineGradient.addColorStop(1, 'rgba(138, 43, 226, 0.3)');

      ctx.lineWidth = 1.2;
      ctx.strokeStyle = lineGradient;
      ctx.lineJoin = 'round';

      for (let i = 0; i < numLines; i++) {
        ctx.beginPath();
        
        // yRatio идет от 0 до 1 (сверху вниз по лицу)
        let yRatio = i / numLines; 
        
        for (let j = 0; j <= pointsPerLine; j++) {
          // Линия идет через ВЕСЬ экран (xRatio от 0 до 1)
          let xRatio = j / pointsPerLine; 
          let screenX = xRatio * width;
          
          // Базовая высота линии на экране
          let baseY = startY + yRatio * faceHeight;
          
          // Проверяем, находится ли точка над "лицом"
          let z = 0;
          if (screenX > startX && screenX < startX + faceWidth) {
             // Переводим экранный X в локальный X лица (от 0 до 1)
             let localFaceX = (screenX - startX) / faceWidth;
             // Читаем высоту со скрытой карты глубины
             z = getZ(localFaceX, yRatio);
          }

          // Выдавливаем линию вверх в зависимости от Z (макс высота экструзии 200px)
          // Легкая анимация волны по лицу
          let wave = (z > 0.1) ? Math.sin(xRatio * 30 - time * 3) * 2 : 0;
          let screenY = baseY - (z * 200) + wave; 

          if (j === 0) ctx.moveTo(screenX, screenY);
          else ctx.lineTo(screenX, screenY);
          
          // Светящиеся частицы-искры на пересечениях (из референса 2)
          if (Math.random() > 0.998 && z > 0) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fillRect(screenX-1, screenY-1, 2, 2);
          }
        }
        ctx.stroke();
      }

      requestAnimationFrame(animateEngine);
    }
    
    animateEngine();
  </script>
</body>
</html>
